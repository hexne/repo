# 仅裁切

nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

backbone:
  - [-1, 1, DataSwitch, []]                  # 0

  - [-1, 1, Conv, [64, 3, 2]]                # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]]               # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]        # 3
  - [-1, 1, Conv, [256, 3, 2]]               # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]        # 5
  - [-1, 1, Conv, [512, 3, 2]]               # 6-P4/16
  - [-1, 2, C3k2, [512, True]]               # 7
  - [-1, 1, Conv, [1024, 3, 2]]              # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]              # 9
  - [-1, 1, SPPF, [1024, 5]]                 # 10
  - [-1, 2, C2PSA, [1024]]                   # 11

  # CatBackbone 分支
  - [[0, 5], 1, CatBackbone, []]             # 12
  - [12, 1, GetFeature, [0, 64]]             # 13
  - [12, 1, GetFeature, [1, 64]]             # 14
  - [12, 1, GetFeature, [2, 64]]             # 15

head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 7], 1, Concat, [1]]                 # 17
  - [-1, 2, C3k2, [512, False]]                # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [13, 1, Conv, [512, 1, 1]]                # 20
  - [[-1, 5, 20], 1, BiFPN, [1]]             # 21
  - [-1, 2, C3k2, [256, False]]                # 22 (P3/8-small)

  - [-1, 1, Conv, [512, 3, 2]]                 # 23
  # - [[-1, 18, 14], 1, Concat, [1]]             # 24
  - [[-1, 18], 1, Concat, [1]]             # 25
  - [-1, 2, C3k2, [512, False]]                # 26 (P4/16-m90 edium)

  - [-1, 1, Conv, [1024, 3, 2]]                # 27
  # - [[-1, 11, 15], 1, Concat, [1]]
  - [[-1, 11], 1, Concat, [1]]             # 28
  - [-1, 2, C3k2, [1024, True]]                # 29 (P5/32-large)

  - [[22, 25, 28], 1, Detect, [nc]]            # 30 Detect(P3, P4, P5)

