nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

backbone:
  - [-1, 1, DataSwitch, []]

  # 主干1
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] # 5
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 11

  # 主干2
  - [0, 1, DWT, [64]]   # 12
  - [-1, 1, DWT, [128]] #
  - [-1, 1, SE, [128]] # 14
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, SE, [256]] # 16
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, SE, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 19

head:
  - [[11, 19], 1, BiFPN2, [1]]       # 20：融合主干1的C2PSA和主干2的Conv1024
  - [[7, 17], 1, BiFPN2, [1]]        # 21：融合主干1的C3k2(512)和主干2的SE(512)
  - [[5, 15], 1, BiFPN2, [1]]        # 22：融合主干1的C3k2(256)和主干2的SE(256)

  - [20, 1, nn.Upsample, [None, 2, "nearest"]] # 23
  - [-1, 1, Conv, [512, 1, 1]]       # 24
  - [[-1, 21], 1, BiFPN2, [1]]       # 25
  - [-1, 2, C3k2, [512, False]]      # 26

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 27
  - [-1, 1, Conv, [256, 1, 1]]       # 28
  - [[-1, 22], 1, BiFPN2, [1]]       # 29
  - [-1, 2, C3k2, [256, False]]      # 30

  - [-1, 1, Conv, [512, 3, 2]]       # 31
  - [[-1, 26], 1, BiFPN2, [1]]       # 32
  - [-1, 2, C3k2, [512, False]]      # 33

  - [-1, 1, Conv, [1024, 3, 2]]      # 34
  - [[-1, 20], 1, BiFPN2, [1]]       # 35
  - [-1, 2, C3k2, [1024, True]]      # 36

  - [[30, 33, 36], 1, Detect, [nc]]  # 37
