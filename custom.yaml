# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

backbone:
  # [from, repeats, module, args]
  - [-1, 1, DataSwitch, []]              # 0
  - [-1, 1, PConv, [64, 3, 2]]           # 1
  - [-1, 1, PConv, [128, 3, 2]]          # 2
  - [-1, 2, C3k2, [256, False, 0.25]]    # 3
  - [-1, 1, PConv, [256, 3, 2]]          # 4
  - [-1, 2, C3k2, [512, False, 0.25]]    # 5  => [512, 64, 64]
  - [-1, 1, PConv, [512, 3, 2]]          # 6
  - [-1, 2, C3k2, [512, True]]           # 7  => [512, 32, 32]
  - [-1, 1, PConv, [1024, 3, 2]]         # 8
  - [-1, 2, C3k2, [1024, True]]          # 9
  - [-1, 1, SPPF, [1024, 5]]             # 10
  - [-1, 2, C2PSA, [1024]]               # 11 => [1024, 16, 16]

  - [0, 1, DWTBackbone, []]              # 12
  - [12, 1, GetFeature, [0, 256]]        # 13
  - [12, 1, GetFeature, [1, 512]]        # 14
  - [12, 1, GetFeature, [2, 1024]]       # 15

  - [[0, 11], 1, CatBackbone, []]        # 16
  - [16, 1, GetFeature, [0, 64]]        # 17
  - [16, 1, GetFeature, [1, 64]]        # 18
  - [16, 1, GetFeature, [2, 64]]        # 19

head:
  # 和DWT拼接
  - [[5, 13], 1, Concat, [1]]            # 20
  - [[7, 14], 1, Concat, [1]]            # 21
  - [[11, 15], 1, Concat, [1]]           # 22

  # 和Cat拼接
  - [[17, 20], 1,  Concat, [1]]           # 23 => [c, 64, 64]
  - [[18, 21], 1, Concat, [1]]            # 24 => [c, 32, 32]
  - [[19, 22], 1,  Concat, [1]]           # 25 => [c, 16, 16]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26
  - [[-1, 24], 1, Concat, [1]]                   # 27
  - [-1, 2, C3k2, [512, False]]                  # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 29
  - [[-1, 23], 1, Concat, [1]]                   # 30
  - [-1, 2, C3k2, [256, False]]                  # 31  # P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]                   # 32
  - [[-1, 28], 1, Concat, [1]]                   # 33
  - [-1, 2, C3k2, [512, False]]                  # 34  # P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 35
  - [[-1, 25], 1, Concat, [1]]                   # 36
  - [-1, 2, C3k2, [1024, True]]                  # 37  # P5/32-large

  - [[31, 34, 37], 1, Detect, [nc]]              # 38